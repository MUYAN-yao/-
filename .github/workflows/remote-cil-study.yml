name: Remote CIL first-round study

on:
  push:
    paths:
      - ".gitattributes"
      - ".github/workflows/remote-cil-study.yml"
      - ".github/scripts/write_remote_reports.py"
      - "inputs/LABEL_VAULT_OPEN_RECEIPT.json"
      - "reference/RESULT.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore checksum-covered checkout bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed dependency
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt

      - name: Run toy example
        id: toy
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/toy_demo.py

      - name: Verify scientific inputs
        id: verify
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/reproduce.py --check-only

      - name: Replay frozen original implementation
        id: replay
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/reproduce.py

      - name: Write aggregate reports
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TOY_OUTCOME: ${{ steps.toy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: python .github/scripts/write_remote_reports.py

      - name: Commit reports without raw replay outputs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath outputs -Recurse -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add first-round remote replay report"
            git push
          }
