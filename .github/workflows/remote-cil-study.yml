name: Remote CIL first-round study

on:
  push:
    paths:
      - ".github/workflows/remote-cil-study.yml"
      - ".github/scripts/write_remote_reports.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed dependency
        run: python -m pip install -r requirements.txt

      - name: Run toy example
        run: python scripts/toy_demo.py

      - name: Verify scientific inputs
        run: python scripts/reproduce.py --check-only

      - name: Replay frozen original implementation
        run: python scripts/reproduce.py

      - name: Write aggregate reports
        run: python .github/scripts/write_remote_reports.py

      - name: Commit reports without raw replay outputs
        run: |
          rm -rf outputs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Add first-round remote replay report"
          git push
