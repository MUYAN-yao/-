name: Remote CIL first-round study

on:
  push:
    paths:
      - ".github/workflows/remote-cil-study.yml"
      - ".github/scripts/write_remote_reports.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed dependency
        id: install
        continue-on-error: true
        run: python -m pip install -r requirements.txt 2>&1 | tee /tmp/install.log

      - name: Run toy example
        id: toy
        continue-on-error: true
        run: python scripts/toy_demo.py 2>&1 | tee /tmp/toy.log

      - name: Verify scientific inputs
        id: verify
        continue-on-error: true
        run: python scripts/reproduce.py --check-only 2>&1 | tee /tmp/verify.log

      - name: Replay frozen original implementation
        id: replay
        continue-on-error: true
        run: python scripts/reproduce.py 2>&1 | tee /tmp/replay.log

      - name: Write aggregate reports
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TOY_OUTCOME: ${{ steps.toy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: python .github/scripts/write_remote_reports.py

      - name: Commit reports without raw replay outputs
        if: always()
        run: |
          rm -rf outputs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Add first-round remote replay report"
          git push
