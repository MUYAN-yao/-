name: Sentinel-grid sensitivity analysis

on:
  push:
    paths:
      - ".gitattributes"
      - ".github/workflows/sentinel-grid-sensitivity.yml"
      - "scripts/run_sentinel_grid_sensitivity.py"
      - "plans/第二阶段_哨兵网格敏感性分析.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sensitivity:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore checksum-covered checkout bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed dependency
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run fixed A/B sensitivity analysis
        shell: pwsh
        run: python scripts/run_sentinel_grid_sensitivity.py

      - name: Commit aggregate report without raw outputs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath outputs -Recurse -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add sentinel-grid sensitivity report"
            git push
          }
